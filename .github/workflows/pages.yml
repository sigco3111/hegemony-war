name: apply-payload

on:
  push:
    branches: [main]
    paths:
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply newest payload
        run: |
          set -e
          zip=$(ls *payload.zip 2>/dev/null | sort -V | tail -1)
          if [ -z "$zip" ]; then echo "no payload found"; exit 0; fi
          rm -rf /tmp/payload && mkdir -p /tmp/payload
          unzip -o "$zip" -d /tmp/payload
          bash /tmp/payload/apply.sh
          rm -f "$zip"
      - name: commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "chore: apply staged payload"
          git push
